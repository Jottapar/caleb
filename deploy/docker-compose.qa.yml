# Entorno de QA. Corre junto al de produccion en el mismo Droplet (ver
# 10. Entornos y Despliegue). El .env vive fuera del repo, en el servidor.
#
# Los puertos solo se publican en localhost (127.0.0.1): nadie en internet
# puede pegarle directo a estos contenedores, solo el Nginx del servidor,
# que es el unico que escucha en 80/443.
services:
  back:
    build:
      context: ../back
    container_name: caleb-back-qa
    restart: unless-stopped
    env_file:
      - /opt/caleb/qa/back.env
    ports:
      - "127.0.0.1:8001:8000"

  front:
    build:
      context: ../front
    container_name: caleb-front-qa
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
