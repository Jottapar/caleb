# React Router usa rutas del lado del cliente (/terceros, /productos, ...).
# Sin el try_files, recargar la pagina en esas rutas daria 404: Nginx buscaria
# un archivo "productos" que no existe. Con el fallback, cualquier ruta que no
# sea un archivo real cae en index.html y React Router toma el control ahi.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
